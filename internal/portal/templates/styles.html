{{define "styles"}}
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card-bg: #ffffff;
    --text: #1c1c1e;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #4f46e5;
    --accent-text: #ffffff;
    --danger: #b91c1c;
    --success: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --card-bg: #1c1c1f;
      --text: #f2f2f3;
      --muted: #9ca3af;
      --border: #2e2e32;
      --accent: #818cf8;
      --accent-text: #111113;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-top: 0; margin-bottom: 24px; font-size: 0.9rem; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 1.05rem; margin-top: 0; }
  .field { margin-bottom: 16px; }
  label.field-label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }
  .hint { color: var(--muted); font-size: 0.82rem; margin-top: 4px; }
  input[type=text], input[type=password], textarea {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
  }
  textarea { min-height: 160px; resize: vertical; }
  .job-row, .day-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .job-row:last-child { border-bottom: none; }
  .job-row input { margin-top: 3px; }
  .job-label { font-weight: 600; font-size: 0.92rem; }
  .job-desc { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }
  .override-badge {
    display: inline-block;
    font-size: 0.72rem;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-text);
    margin-left: 6px;
    vertical-align: middle;
  }
  .days-grid { display: flex; flex-wrap: wrap; gap: 14px; }
  .day-pill { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; }
  button {
    display: inline-block;
    padding: 9px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.9rem;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .banner { padding: 10px 14px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; }
  .banner.error { background: #fee2e2; color: var(--danger); border: 1px solid #fecaca; }
  .banner.success { background: #dcfce7; color: var(--success); border: 1px solid #bbf7d0; }
</style>
{{end}}
